name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les tags sont nécessaires : `check-version` refuse un numéro déjà
          # publié, et sans historique il ne peut rien affirmer.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Node 24+ lit le TypeScript nativement — le script de build importe
          # directement les sources `src/*.ts` sans étape de compilation.
          node-version: '24'
          cache: npm
      # Échoue si les fichiers générés ont divergé de leur source : une modif de
      # token ou de fiche composant doit être committée avec ses dérivés régénérés.
      - run: npm ci
      - run: npm run check
      # La vitrine casse dès qu'une story vise un composant qui a changé de
      # props. Mieux vaut l'apprendre ici que devant une page publiée à moitié.
      - run: npm run vitrine
      # Le second contrôle de contraste : celui-ci mesure le RENDU, pas les
      # classes. Il voit ce que le contrôle statique ne peut pas voir — un fond
      # posé sur le parent et une couleur sur l'enfant. Trois défauts sont passés
      # par cet angle mort en une seule journée.
      #
      # Chrome est déjà présent sur le runner : le script le prend plutôt que de
      # télécharger 150 Mo de chromium à chaque exécution.
      - run: npm run contraste-rendu

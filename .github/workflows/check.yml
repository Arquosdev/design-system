name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24+ lit le TypeScript nativement — le script de build importe
          # directement les sources `src/*.ts` sans étape de compilation.
          node-version: '24'
      # Échoue si `dist/` a divergé de `src/` : une modif de token doit toujours
      # être committée avec ses formats dérivés régénérés.
      - run: npm run check
